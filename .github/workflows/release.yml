# Publishes every chart whose version has no release yet:
#   - GitHub release + gh-pages index.yaml (https://openartifact.github.io/helm-charts)
#   - OCI artifact (oci://ghcr.io/openartifact/charts/<chart>)
name: Release charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

concurrency:
  group: release-charts
  cancel-in-progress: false

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1

jobs:
  release:
    name: release charts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # chart-releaser: GitHub releases + gh-pages index
      packages: write # push charts to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # chart-releaser pushes with CR_TOKEN, not the checkout credentials

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push charts to GHCR and sign them (cosign keyless)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No new chart versions to push."
            exit 0
          fi
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for pkg in "${packages[@]}"; do
            out=$(helm push "$pkg" "$OCI_REPO" 2>&1)
            echo "$out"
            # `helm push` prints "Pushed: <repo>/<chart>:<version>" and "Digest: sha256:<digest>".
            ref=$(awk '/^Pushed:/ {print $2}' <<<"$out")
            digest=$(awk '/^Digest:/ {print $2}' <<<"$out")
            if [ -z "$ref" ] || [ -z "$digest" ]; then
              echo "::error::could not determine pushed reference/digest for $pkg"
              exit 1
            fi
            cosign sign --yes "${ref%:*}@${digest}"
          done
