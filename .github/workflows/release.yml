# Publishes every chart whose version has no release yet:
#   - GitHub release + gh-pages index.yaml (https://openartifact.github.io/helm-charts)
#   - OCI artifact (oci://ghcr.io/openartifact/charts/<chart>)
name: Release charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

concurrency:
  group: release-charts
  cancel-in-progress: false

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: true

      - name: Push charts to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No new chart versions to push."
            exit 0
          fi
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for pkg in "${packages[@]}"; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
