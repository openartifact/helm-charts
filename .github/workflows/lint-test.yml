name: Lint and test charts

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  CNPG_CHART_VERSION: 0.29.1

jobs:
  lint-test:
    name: lint and install charts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          check-latest: true

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: List changed charts
        id: list-changed
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(ct list-changed --config ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            ct lint --config ct.yaml --all --check-version-increment=false
          else
            ct lint --config ct.yaml
          fi

      - name: Reject unvalidated failure modes
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          # Multi-replica filesystem storage on a ReadWriteOnce volume must not render.
          if helm template t charts/openartifact --set database.external.host=pg --set replicaCount=2 >/dev/null 2>&1; then
            echo "expected render failure for replicaCount=2 on ReadWriteOnce filesystem storage" >&2
            exit 1
          fi
          # The bootstrap Secret modes are mutually exclusive, and the token needs a Secret.
          if helm template t charts/openartifact --set database.external.host=pg --set bootstrap.existingSecret=x --set bootstrap.createSecret=true >/dev/null 2>&1; then
            echo "expected render failure for bootstrap.existingSecret together with bootstrap.createSecret" >&2
            exit 1
          fi
          if helm template t charts/openartifact --set database.external.host=pg --set bootstrap.adminToken.enabled=true >/dev/null 2>&1; then
            echo "expected render failure for bootstrap.adminToken.enabled without a Secret" >&2
            exit 1
          fi
          helm template t charts/openartifact --set database.external.host=pg --set bootstrap.existingSecret=x --set bootstrap.adminToken.enabled=true |
            grep -q OPENARTIFACT_BOOTSTRAP_ADMIN_TOKEN_FILE
          # OpenArtifact 0.15 roles: the default is one Deployment with role all; worker.enabled
          # adds a worker Deployment (object storage, as for several replicas).
          helm template t charts/openartifact --set database.external.host=pg | grep -q 'value: "all"'
          split=$(helm template t charts/openartifact --set database.external.host=pg --set worker.enabled=true --set storage.type=s3 --set storage.bucket=b)
          grep -q 'value: "web"' <<<"$split"
          grep -q 'value: "worker"' <<<"$split"
          if helm template t charts/openartifact --set database.external.host=pg --set worker.enabled=true >/dev/null 2>&1; then
            echo "expected render failure for worker.enabled on ReadWriteOnce filesystem storage" >&2
            exit 1
          fi
          # The OCI relay needs a persistent staging directory.
          if helm template t charts/openartifact --set database.external.host=pg --set storage.type=oci >/dev/null 2>&1; then
            echo "expected render failure for storage.type=oci without storage.stagingPath" >&2
            exit 1
          fi
          helm template t charts/openartifact --set database.external.host=pg --set storage.type=oci --set storage.stagingPath=/var/lib/staging --set storage.staging.persistence.enabled=true |
            grep -q STORAGE_STAGING_PATH
          # Behind an Ingress the trusted proxies default to ingress.trustedProxies.
          helm template t charts/openartifact --set database.external.host=pg --set ingress.enabled=true |
            grep -q OPENARTIFACT_TRUSTED_PROXIES
          # The helm test Pod must stay outside the NetworkPolicy and Service selectors: with
          # egress restricted the policy would drop its request to the Service.
          helm template t charts/openartifact --set database.external.host=pg --show-only templates/tests/test-connection.yaml |
            grep -q 'app.kubernetes.io/name: openartifact-test$'
          # Telemetry: every misconfiguration must fail to render.
          reject() {
            local why=$1
            shift
            if helm template t charts/openartifact --set database.external.host=pg "$@" >/dev/null 2>&1; then
              echo "expected render failure for $why" >&2
              exit 1
            fi
          }
          reject "telemetry.otlp.headersExistingSecret without telemetry.otlp.enabled" \
            --set telemetry.otlp.headersExistingSecret=h
          reject "telemetry.collector.enabled without telemetry.otlp.enabled" \
            --set telemetry.collector.enabled=true --set telemetry.collector.exporter.endpoint=http://b:4318 --set telemetry.collector.exporter.protocol=http
          reject "telemetry.collector.enabled with telemetry.otlp.endpoint" \
            --set telemetry.otlp.enabled=true --set telemetry.otlp.endpoint=x:4317 \
            --set telemetry.collector.enabled=true --set telemetry.collector.exporter.endpoint=b:4317
          reject "telemetry.collector.enabled without telemetry.collector.exporter.endpoint" \
            --set telemetry.otlp.enabled=true --set telemetry.collector.enabled=true
          reject "telemetry.collector.exporter.protocol=http with a non-URL endpoint" \
            --set telemetry.otlp.enabled=true --set telemetry.collector.enabled=true \
            --set telemetry.collector.exporter.protocol=http --set telemetry.collector.exporter.endpoint=backend:4318
          reject "telemetry.collector.pprof.enabled without the sidecar" \
            --set telemetry.collector.pprof.enabled=true --set pprof.enabled=true --set telemetry.collector.pprof.tokenExistingSecret=t
          reject "telemetry.collector.pprof.enabled without pprof.enabled" \
            --set telemetry.otlp.enabled=true --set telemetry.collector.enabled=true --set telemetry.collector.exporter.endpoint=b:4317 \
            --set telemetry.collector.pprof.enabled=true --set telemetry.collector.pprof.tokenExistingSecret=t
          reject "telemetry.collector.pprof.enabled without tokenExistingSecret" \
            --set telemetry.otlp.enabled=true --set telemetry.collector.enabled=true --set telemetry.collector.exporter.endpoint=b:4317 \
            --set telemetry.collector.pprof.enabled=true --set pprof.enabled=true
          # Frontend telemetry: needs the OTLP master switch, an http(s) URL and an OTLP/HTTP target.
          reject "telemetry.frontend.enabled without telemetry.otlp.enabled" \
            --set telemetry.frontend.enabled=true --set telemetry.frontend.endpoint=http://c:4318
          reject "telemetry.frontend.endpoint that is not an http(s) URL" \
            --set telemetry.otlp.enabled=true --set telemetry.frontend.enabled=true --set telemetry.frontend.endpoint=c:4318
          reject "telemetry.frontend.enabled with protocol grpc and no telemetry.frontend.endpoint" \
            --set telemetry.otlp.enabled=true --set telemetry.otlp.protocol=grpc --set telemetry.otlp.endpoint=c:4317 --set telemetry.frontend.enabled=true
          reject "telemetry.frontend.enabled without any endpoint" \
            --set telemetry.otlp.enabled=true --set telemetry.otlp.protocol=http --set telemetry.frontend.enabled=true
          # Frontend telemetry renders its env vars; the sidecar is the default relay target.
          helm template t charts/openartifact -f charts/openartifact/ci/collector-sidecar-values.yaml --set telemetry.frontend.enabled=true >/tmp/frontend.yaml
          grep -q 'OPENARTIFACT_TELEMETRY_FRONTEND_ENABLED' /tmp/frontend.yaml
          grep -A1 'OPENARTIFACT_TELEMETRY_FRONTEND_ENDPOINT' /tmp/frontend.yaml | grep -q 'http://localhost:4318'
          helm template t charts/openartifact -f charts/openartifact/ci/collector-sidecar-values.yaml --show-only templates/collector-configmap.yaml |
            grep -c 'processors: \[memory_limiter, redaction/frontend, batch\]' | grep -qx 2
          # OTLP egress port per endpoint form. A marker CIDR picks the OTLP rule out of the policy.
          otlp_port() {
            helm template t charts/openartifact --set database.external.host=pg \
              --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true \
              --set telemetry.otlp.enabled=true \
              --set 'networkPolicy.egress.otlp.to[0].ipBlock.cidr=203.0.113.7/32' "$@" \
              --show-only templates/networkpolicy.yaml |
              grep -B6 'cidr: 203.0.113.7/32' | grep -o 'port: [0-9]*' | tail -n 1 | cut -d' ' -f2
          }
          assert_port() {
            local want=$1 got
            shift
            got=$(otlp_port "$@")
            if [ "$got" != "$want" ]; then
              echo "OTLP egress port: expected $want, got '$got' for: $*" >&2
              exit 1
            fi
          }
          assert_port 443 --set telemetry.otlp.endpoint=https://otlp.example.com --set telemetry.otlp.protocol=http
          assert_port 80 --set telemetry.otlp.endpoint=http://otlp.example.com --set telemetry.otlp.protocol=http
          assert_port 4318 --set telemetry.otlp.endpoint=https://otlp.example.com:4318 --set telemetry.otlp.protocol=http
          assert_port 4317 --set telemetry.otlp.endpoint=otel-collector:4317 --set telemetry.otlp.protocol=grpc
          assert_port 4317 --set telemetry.otlp.endpoint=otel-collector --set telemetry.otlp.protocol=grpc
          assert_port 4318 --set telemetry.otlp.endpoint=otel-collector --set telemetry.otlp.protocol=http
          for ep in "https://otlp.example.com http" "http://otlp.example.com http" "https://otlp.example.com:4318 http" \
            "otel-collector:4317 grpc" "otel-collector grpc" "otel-collector http"; do
            read -r endpoint protocol <<<"$ep"
            assert_port 9999 --set telemetry.otlp.endpoint="$endpoint" --set telemetry.otlp.protocol="$protocol" --set networkPolicy.egress.otlp.port=9999
          done
          # With the sidecar, the rule follows the sidecar's exporter endpoint.
          assert_port 4318 -f charts/openartifact/ci/collector-sidecar-values.yaml
          assert_port 4317 --set telemetry.collector.enabled=true --set telemetry.collector.exporter.endpoint=backend --set telemetry.collector.exporter.protocol=grpc
          assert_port 9999 -f charts/openartifact/ci/collector-sidecar-values.yaml --set networkPolicy.egress.otlp.port=9999

      - name: Validate the Collector sidecar configuration
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          # Render the sidecar config with the CI values and let the pinned otelcol-contrib image
          # (tag and digest from values.yaml, as the chart renders them) validate it.
          values=charts/openartifact/ci/collector-sidecar-values.yaml
          image=$(helm template t charts/openartifact -f "$values" | grep -m1 -o 'image: .*opentelemetry-collector-contrib.*' | cut -d' ' -f2 | tr -d '"')
          test -n "$image"
          dir=$(mktemp -d)
          chmod 755 "$dir" # the image runs as a non-root user
          helm template t charts/openartifact -f "$values" --show-only templates/collector-configmap.yaml |
            sed -n '/^  config.yaml: |/,$p' | tail -n +2 | sed 's/^    //' >"$dir/config.yaml"
          docker run --rm -v "$dir:/cfg:ro" "$image" validate --config=/cfg/config.yaml

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.list-changed.outputs.changed == 'true'

      - name: Install CloudNativePG operator
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm install cnpg cloudnative-pg \
            --repo https://cloudnative-pg.github.io/charts \
            --version "$CNPG_CHART_VERSION" \
            --namespace cnpg-system --create-namespace --wait

      - name: Install and test
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            ct install --config ct.yaml --all
          else
            ct install --config ct.yaml
          fi
