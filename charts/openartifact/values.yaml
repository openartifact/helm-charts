# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name prefix.
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: openartifact/openartifact
  # -- Image tag; defaults to the chart appVersion.
  tag: ""
  # -- Image digest (sha256:...); takes precedence over the tag when set.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Number of replicas. More than one replica requires object storage
# (storage.type != filesystem) or a ReadWriteMany volume.
replicaCount: 1
revisionHistoryLimit: 5

# -- Deployment strategy. Empty = Recreate for filesystem storage on a
# ReadWriteOnce volume (the volume cannot be attached twice), RollingUpdate otherwise.
updateStrategy: {}

# -- Public base URL (BASE_URL), e.g. https://artifacts.example.com.
# Required for OIDC/SAML callbacks and correct download links behind a proxy.
baseUrl: ""

config:
  logLevel: info  # debug | info | warn | error
  logFormat: json  # json | text
  allowAnonymousRead: false
  # -- Accept the legacy API_KEY (secrets.apiKey) for write endpoints.
  legacyApiKeyEnabled: false
  sessionDurationHours: 24
  # -- Allowed CORS origins.
  corsOrigins: []
  # -- CIDRs of reverse proxies whose X-Forwarded-For is trusted (usually the pod CIDR of your ingress controller).
  trustedProxies: []
  # -- Allowed client CIDRs (empty = allow all).
  ipAllowlist: []
  # -- Requests per second per client IP (0 = disabled).
  rateLimitRps: 0
  # -- Apply schema migrations at startup (guarded by a Postgres advisory lock, safe with several replicas).
  migrateOnStart: true
  shutdownTimeout: 30
  # -- Let any authenticated user create a project and become its owner
  # (OPENARTIFACT_PROJECTS_SELF_CREATE). false = only global admins create projects.
  # An administrator can override it at runtime (system setting projects.self_create).
  projectsSelfCreate: false

# -- Docker/OCI blob upload staging. All keys are optional; unset keys keep the
# server default (staging in <tmp>/openartifact/docker-uploads on the /tmp emptyDir,
# sessions idle for 24h are removed). Set `dir` to stage uploads on a dedicated
# volume (sizeLimit, or persistence) instead of the /tmp scratch volume.
dockerUploads:
  # -- OPENARTIFACT_DOCKER_UPLOAD_DIR (absolute path). Empty = server default under /tmp.
  dir: ""
  # -- OPENARTIFACT_DOCKER_UPLOAD_TTL: how long an idle upload session is kept, e.g. 24h.
  ttl: ""
  # -- Size limit of the emptyDir backing `dir` (e.g. 20Gi); ignored with persistence.enabled.
  sizeLimit: ""
  # -- Persistent volume backing `dir` instead of an emptyDir.
  persistence:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

# -- Writable scratch volume mounted at /tmp (the root filesystem is read-only).
# Large uploads (Maven, npm, RPM, DEB, raw, restores) and proxy downloads are
# spooled here before they reach the blob store.
tmp:
  # -- Size limit of the emptyDir, e.g. 10Gi. Empty = unlimited (node ephemeral storage).
  sizeLimit: ""
  # -- "" (node disk) or Memory (tmpfs; counts against the memory limit).
  medium: ""

# -- Deferred deletion of blob bytes (OPENARTIFACT_BLOB_DELETION_*).
blobDeletion:
  # -- Grace period before bytes of a deleted blob are removed (server default 24h; 0 = as soon as no backup needs them).
  grace: ""
  # -- Sweeper interval (server default 1m).
  sweepInterval: ""
  # -- Blobs removed per sweeper pass, >= 1 (server default 200).
  sweepBatch: null

# -- Storage tier mover (OPENARTIFACT_TIERING_*). Tiers and policies are managed
# through the admin UI/API; with only the primary store these have no effect.
# Empty/null = server default.
tiering:
  # -- Switch the background mover on or off (server default true). While on, database.maxOpenConns must be 0 or >= 4.
  enabled: null
  # -- Pause between mover passes (server default 5m).
  interval: ""
  # -- Blobs per pass, >= 1 (server default 200).
  batch: null
  # -- Concurrent moves, >= 1 (server default 2).
  concurrency: null
  # -- Bandwidth cap in bytes per second, 0 = unlimited (server default 67108864 = 64 MiB/s).
  maxBytesPerSecond: null
  # -- Re-read and verify each blob after copying it (server default true).
  verifyReadback: null
  # -- How often read times are flushed to the database (server default 30s).
  accessFlushInterval: ""
  # -- How often tiers and policies are reloaded (server default 30s).
  refreshInterval: ""

# -- Vulnerability scanners (trivy, grype); the default OSV scanner needs none of this.
# The image does not bundle them unless built with the SCANNERS build argument, so
# either use such an image, or set `install: auto` to let the server download the
# pinned, checksum-verified release into the cache volume. Scan databases are
# downloaded in the background into the cache (several GB).
scanners:
  cache:
    # -- OPENARTIFACT_SCANNER_CACHE_DIR; databases and auto-installed binaries (<path>/bin) live here.
    # The volume must be writable by uid/gid 10001 and mounted with exec.
    path: /var/cache/openartifact/scanners
    # -- Size limit of the emptyDir backing the cache (databases need ~5 GB with both scanners); ignored with persistence.enabled.
    sizeLimit: ""
    # -- Persist the cache so a restart neither re-downloads the databases nor the binaries.
    persistence:
      enabled: false
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      annotations: {}
  # -- Never download databases; scans use only what the cache already holds (OPENARTIFACT_SCANNER_OFFLINE).
  offline: false
  # -- Pause between database refreshes, 0 or >= 1h (server default 6h; OPENARTIFACT_SCANNER_UPDATE_INTERVAL).
  updateInterval: ""
  # -- https origin serving GitHub's release paths, used by install=auto (server default https://github.com).
  downloadBaseUrl: ""
  trivy:
    # -- none | auto. auto downloads the pinned release when `path` is empty and trivy is not on PATH. The version is pinned by the server, not by the chart.
    install: none
    # -- Binary: command name on PATH or absolute path. Empty = trivy.
    path: ""
    # -- OCI repository mirroring ghcr.io/aquasecurity/trivy-db. Empty = upstream.
    dbRepository: ""
    # -- OCI repository mirroring ghcr.io/aquasecurity/trivy-java-db. Empty = no Java database.
    javaDbRepository: ""
  grype:
    # -- none | auto (see trivy.install).
    install: none
    path: ""
    # -- Database listing URL of a mirror (OPENARTIFACT_GRYPE_DB_URL). Empty = upstream.
    dbUrl: ""

telemetry:
  # -- OpenTelemetry traces (and optionally metrics) over OTLP, off by default.
  # /metrics is unaffected.
  otlp:
    enabled: false
    # -- Collector endpoint, host:port or http(s) URL (OTEL_EXPORTER_OTLP_ENDPOINT). Empty = SDK default (localhost).
    endpoint: ""
    # -- grpc | http (OTLP/HTTP protobuf). Empty = server default (grpc).
    protocol: ""
    # -- Plaintext to the collector (an http:// endpoint implies it).
    insecure: false
    # -- service.name resource attribute. Empty = openartifact.
    serviceName: ""
    # -- Fraction of new traces recorded, 0..1. null = server default (1).
    sampleRatio: null
    # -- Also export the Prometheus registry as OTLP metrics (OTEL_METRICS_EXPORTER=otlp).
    metrics: false
    # -- Existing Secret holding the collector credentials as OTEL_EXPORTER_OTLP_HEADERS
    # (k=v,k2=v2, values percent-encoded) under `headersSecretKey`. Never put them in values.
    headersExistingSecret: ""
    headersSecretKey: OTEL_EXPORTER_OTLP_HEADERS
  # -- OpenTelemetry Collector (contrib) sidecar, off by default. Requires telemetry.otlp.enabled
  # with an empty telemetry.otlp.endpoint: the app then exports to the sidecar on localhost
  # (telemetry.otlp.protocol picks grpc or http), and telemetry.otlp.headersExistingSecret is
  # not used. The sidecar batches, queues and retries; its queue survives container restarts,
  # not the loss of the pod.
  collector:
    enabled: false
    image:
      registry: docker.io
      repository: otel/opentelemetry-collector-contrib
      tag: 0.163.2
      # -- Image digest (sha256:...); takes precedence over the tag when set.
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    exporter:
      # -- Backend the sidecar exports to: host:port or http(s) URL for grpc, http(s) URL for http.
      # Required unless `config` is set.
      endpoint: ""
      # -- grpc | http (OTLP/HTTP protobuf).
      protocol: grpc
      # -- Plaintext to the backend.
      insecure: false
      # -- Existing Secret holding the backend headers as a YAML or JSON map under
      # `headersSecretKey`, e.g. {"authorization": "Bearer ..."}. Never put them in values.
      headersExistingSecret: ""
      headersSecretKey: headers
    # -- Size limit of the emptyDir holding the persistent sending queue.
    queueSizeLimit: 1Gi
    # -- Full Collector configuration (a map) replacing the rendered one. The app still exports
    # to localhost:4317 (grpc) or localhost:4318 (http).
    config: {}

pprof:
  # -- Mount Go's runtime profiler at /api/v1/admin/pprof/ (OPENARTIFACT_PPROF_ENABLED).
  # Admin only; leave it off outside diagnostics.
  enabled: false

# -- Extra plain environment variables (name: value), e.g. AI_ENABLED: "true".
# Put sensitive values in secrets.extra or secrets.existingSecret instead.
env: {}
# -- Extra environment variables in Kubernetes list form (supports valueFrom).
extraEnv: []
# -- Extra envFrom sources.
extraEnvFrom: []

secrets:
  # -- Use an existing Secret instead of the chart-managed one. It is loaded with envFrom,
  # so keys are environment variable names. It MUST contain AUTH_HMAC_KEY and
  # OPENARTIFACT_SECRET_KEY, and METRICS_AUTH_TOKEN when metrics.enabled is true.
  existingSecret: ""
  # -- AUTH_HMAC_KEY for OIDC/SAML login state. Generated (and kept across upgrades) when empty.
  hmacKey: ""
  # -- OPENARTIFACT_SECRET_KEY (>= 16 bytes) encrypting stored credentials at rest.
  # Generated (and kept across upgrades) when empty. Losing it makes stored secrets unreadable.
  encryptionKey: ""
  # -- Legacy write API key (API_KEY). Not set when empty.
  apiKey: ""
  # -- Additional sensitive environment variables (name: value), e.g. AI_API_KEY,
  # OPENARTIFACT_SAML_SP_CERT, OPENARTIFACT_SAML_SP_KEY.
  extra: {}
  # -- Keep the chart-managed Secret on `helm uninstall` so the encryption key survives.
  keepOnUninstall: true

# First admin account. Only applied by the server to an EMPTY database (see the
# README, "First admin"); an existing admin is never changed. Needs an OpenArtifact
# release that supports the bootstrap settings (0.11.0 or newer): older images
# ignore them and print a random password instead.
bootstrap:
  # -- Existing Secret with the key `admin-password` and, when adminToken.enabled, `admin-token`.
  # Mounted read-only as files. Use this with Argo CD or any tool that renders with `helm template`.
  existingSecret: ""
  # -- Let the chart create the Secret `<fullname>-bootstrap` with a random admin password
  # (and token) generated once via `lookup`, so it stays stable across upgrades. `lookup`
  # returns nothing under `helm template`: with Argo CD use existingSecret instead.
  createSecret: false
  # -- Force a password change at the first login (OPENARTIFACT_BOOTSTRAP_FORCE_PASSWORD_CHANGE).
  forcePasswordChange: false
  adminToken:
    # -- Also create an admin API token named `bootstrap` from the Secret key `admin-token`
    # (`oa_pat_` + 32 to 128 characters), so `oa apply` works on the first sync.
    enabled: false
    # -- Lifetime of that token (Go duration, e.g. 720h); empty = no expiry.
    ttl: ""

database:
  # -- DB_SSLMODE: disable | require | verify-ca | verify-full.
  sslMode: require
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetimeMinutes: 30
  # -- Connection settings for an external PostgreSQL (ignored when cnpg.enabled).
  external:
    host: ""
    port: 5432
    name: artifact_repo
    user: openartifact
    # -- Password stored in the chart-managed Secret. Prefer existingSecret.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password
  # -- Retry the initial database connection at startup instead of failing
  # (DB_CONNECT_TIMEOUT = connectTimeout). false = fail at once.
  waitForDatabase: true
  # -- How long the server waits for the database at startup (Go duration).
  connectTimeout: 60s

# -- Provision PostgreSQL with a CloudNativePG Cluster. Requires the CloudNativePG
# operator (https://cloudnative-pg.io) to be installed in the cluster.
cnpg:
  enabled: false
  instances: 1
  # -- PostgreSQL image; empty uses the operator default.
  imageName: ""
  database: openartifact
  owner: openartifact
  storage:
    size: 8Gi
    storageClass: ""
  resources: {}
  # -- Create a PodMonitor for the database (requires the Prometheus Operator).
  enablePodMonitor: false
  # -- Extra fields merged into the Cluster spec (backup, affinity, postgresql parameters, ...).
  extraSpec: {}

storage:
  # -- Blob backend: filesystem | s3 | garage | seaweedfs | gcs | azure | oci.
  type: filesystem
  # -- Filesystem path (filesystem backend).
  path: /var/lib/artifacts
  # -- Bucket (s3, garage, seaweedfs).
  bucket: ""
  region: ""
  # -- Endpoint override (S3-compatible stores, oci registry).
  endpoint: ""
  forcePathStyle: false
  # -- Presigned URL TTL, e.g. 5m (clamped to [1m, 1h]).
  presignTtl: ""
  gcs:
    bucket: ""
  azure:
    accountName: ""
    containerName: ""
  oci:
    insecure: false
  credentials:
    # -- Existing Secret loaded with envFrom; keys are environment variable names
    # (STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, OPENARTIFACT_GCS_HMAC_KEY,
    # OPENARTIFACT_GCS_HMAC_SECRET, OPENARTIFACT_AZURE_ACCOUNT_KEY,
    # STORAGE_OCI_USERNAME, STORAGE_OCI_PASSWORD).
    existingSecret: ""
    # -- S3 access key; leave empty to use the AWS credential chain (e.g. IRSA / Pod Identity).
    accessKey: ""
    secretKey: ""
    gcsHmacKey: ""
    gcsHmacSecret: ""
    azureAccountKey: ""
    ociUsername: ""
    ociPassword: ""

persistence:
  # -- Persistent volume for filesystem blob storage. Ignored for object storage backends.
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  annotations: {}

backups:
  # -- OPENARTIFACT_BACKUP_DIR.
  path: /var/lib/openartifact/backups
  # -- Lease of a running backup without a heartbeat, after which a crashed backup stops
  # holding blob deletions back (OPENARTIFACT_BACKUP_LEASE_TTL, server default 5m; must be positive).
  leaseTtl: ""
  persistence:
    # -- Persist backups on a dedicated volume; an emptyDir is used otherwise.
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

gpg:
  # -- Enable GPG signing of repository metadata (Debian, RPM).
  enabled: false
  # -- Secret holding the armored private key under `private.key` and, optionally,
  # the passphrase under `passphrase`.
  existingSecret: ""

metrics:
  # -- Expose /metrics, protected by METRICS_AUTH_TOKEN (generated when empty).
  enabled: false
  authToken: ""
  serviceMonitor:
    # -- Create a ServiceMonitor (requires the Prometheus Operator).
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  # -- Large artifact uploads usually need a raised body size limit, e.g.
  # nginx.ingress.kubernetes.io/proxy-body-size: "0".
  annotations: {}
  hosts:
    - host: artifacts.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Gateway API HTTPRoute (gateway.networking.k8s.io/v1).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -- Seconds Kubernetes waits after SIGTERM before SIGKILL. It must cover the
# whole graceful shutdown of the server, in order: in-flight HTTP requests
# (config.shutdownTimeout, 30) + cancelled background backups, restores and
# scans (up to 15) + worker stop and final audit flush (up to 5) + telemetry
# flush (up to 5) = 55, plus headroom for the workers to finish their current
# pass. Raise it together with config.shutdownTimeout.
terminationGracePeriodSeconds: 75

autoscaling:
  # -- Requires object storage or a ReadWriteMany volume.
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  # -- Created only when more than one replica can run.
  enabled: true
  maxUnavailable: 1

networkPolicy:
  # -- Restrict ingress to the HTTP port. Egress is not restricted (database,
  # object storage, upstream proxies and webhooks need it).
  enabled: false
  # -- Allowed peers; empty allows any source on the HTTP port.
  from: []
  egress:
    # -- Also restrict egress (policyTypes Egress). Only DNS, the CloudNativePG cluster
    # (cnpg.enabled), the rules below and `extra` are then allowed: add the external
    # database, object storage, upstream proxies, webhook targets and OIDC/SAML
    # providers to `extra`, or the server cannot reach them.
    enabled: false
    # -- Allow DNS (port 53 UDP/TCP) to any namespace.
    dns: true
    # -- Allow the OTLP collector when telemetry.otlp.enabled (with telemetry.collector.enabled,
    # the sidecar's exporter endpoint instead). `to` is a list of NetworkPolicy
    # peers (namespaceSelector/podSelector/ipBlock); empty = any destination on the port.
    otlp:
      to: []
      # -- Overrides the port derived from the endpoint (telemetry.otlp.endpoint, or
      # telemetry.collector.exporter.endpoint with the sidecar): its port when it has one, else
      # 443 for https:// and 80 for http:// URLs, else 4317 (grpc) or 4318 (http).
      port: null
    # -- Allow scanner downloads (databases from ghcr.io, mirror.gcr.io, grype.anchore.io and,
    # with install=auto, github.com / release-assets.githubusercontent.com). NetworkPolicy
    # cannot match host names, so `to` is an IP/CIDR or pod peer (e.g. your mirror or proxy);
    # empty = any destination on the ports. Not rendered when scanners.offline=true.
    scanners:
      to: []
      ports:
        - 443
    # -- Extra egress rules, appended verbatim (NetworkPolicyEgressRule list).
    extra: []

nodeSelector: {}
tolerations: []
# -- Pod affinity. Empty = prefer spreading replicas across nodes (soft pod anti-affinity).
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []
