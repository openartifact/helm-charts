apiVersion: v2
name: openartifact
description: >-
  Self-hosted artifact repository for many package formats: Maven, npm, PyPI,
  Docker/OCI, Helm, Debian, RPM, Go, Cargo, NuGet, RubyGems, Conda, Conan, Ivy,
  sbt and raw.
type: application
version: 0.10.2
appVersion: "0.13.2"
kubeVersion: ">=1.29.0-0"
home: https://github.com/openartifact/openartifact
icon: https://raw.githubusercontent.com/openartifact/openartifact/main/docs/assets/logo.png
sources:
  - https://github.com/openartifact/openartifact
  - https://github.com/openartifact/helm-charts
keywords:
  - artifact-repository
  - maven
  - npm
  - pypi
  - oci
  - registry
maintainers:
  - name: The OpenArtifact Authors
    url: https://github.com/openartifact
annotations:
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/changes: |
    - kind: added
      description: config.shutdownDelay (SERVER_SHUTDOWN_DELAY, default 10) keeps a terminating pod serving but not ready before it closes the listener, for graceful rolling updates; terminationGracePeriodSeconds is now 85 and the readiness probe is faster. Needs OpenArtifact 0.13.2 or newer.
    - kind: security
      description: Known issue - the optional Collector sidecar image (otel/opentelemetry-collector-contrib 0.163.2, off by default) carries go-jose/v4 4.1.5 (CVE-2026-116587, HIGH, DoS when parsing JWKs with RSA keys; fixed in 4.1.6). No collector release ships the fix yet; it is ignored in CI until 2026-11-27 and the sidecar does not parse untrusted JWKs in the chart's configuration.
    - kind: changed
      description: Default image OpenArtifact 0.13.2 (no migrations; /ready answers 503 during server.shutdownDelay; new openartifact_telemetry_log_records_dropped_total counter).
  artifacthub.io/signKey: |
    fingerprint: 2CB218184F573BAAFC532E84D4DE9B5D6FDD2ACD
    url: https://openartifact.github.io/helm-charts/pgp_keys.asc
  artifacthub.io/images: |
    - name: openartifact
      image: ghcr.io/openartifact/openartifact:0.13.2
      platforms:
        - linux/amd64
        - linux/arm64
    - name: otel-collector
      image: otel/opentelemetry-collector-contrib:0.163.2
      platforms:
        - linux/amd64
        - linux/arm64
