apiVersion: v2
name: openartifact
description: >-
  Self-hosted artifact repository for many package formats: Maven, npm, PyPI,
  Docker/OCI, Hugging Face, Helm, Debian, RPM, Go, Cargo, NuGet, RubyGems, Conda, Conan, Ivy,
  sbt, Terraform, Alpine, Arch, Nix, Ansible and raw.
type: application
version: 0.17.0
appVersion: "0.20.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/openartifact/openartifact
icon: https://raw.githubusercontent.com/openartifact/openartifact/main/docs/assets/logo.png
sources:
  - https://github.com/openartifact/openartifact
  - https://github.com/openartifact/helm-charts
keywords:
  - artifact-repository
  - maven
  - npm
  - pypi
  - oci
  - registry
maintainers:
  - name: The OpenArtifact Authors
    url: https://github.com/openartifact
annotations:
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/changes: |
    - kind: changed
      description: Default image OpenArtifact 0.20.0 (Dex connector pinning and vendor icons for SSO, format handlers refuse repositories of another format, per-image docker blob delete, fail-closed vulnerability gate). Migrations 015-019 run on start; 015 builds indexes concurrently and can take a while on large tables. Chart templates unchanged.
    - kind: added
      description: Experimental telemetry.frontend.enabled and telemetry.frontend.endpoint (OPENARTIFACT_TELEMETRY_FRONTEND_*, app 0.20.0 or newer). The endpoint defaults to the Collector sidecar (http://localhost:4318); the chart fails without an OTLP/HTTP target.
    - kind: changed
      description: The Collector sidecar's traces and logs pipelines run the redaction/frontend processor (URLs and query strings), copied from the app's docker/otel-collector.yaml.
    - kind: security
      description: Collector sidecar image otel/opentelemetry-collector-contrib 0.165.0, which ships go-jose/v4 4.1.6 and fixes CVE-2026-116587 (HIGH, DoS when parsing JWKs with RSA keys). The CI ignore entry is removed.
  artifacthub.io/signKey: |
    fingerprint: 2CB218184F573BAAFC532E84D4DE9B5D6FDD2ACD
    url: https://openartifact.github.io/helm-charts/pgp_keys.asc
  artifacthub.io/images: |
    - name: openartifact
      image: ghcr.io/openartifact/openartifact:0.20.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: otel-collector
      image: otel/opentelemetry-collector-contrib:0.165.0
      platforms:
        - linux/amd64
        - linux/arm64
