{{- if .Values.bootstrap.createSecret }}
{{- $name := include "openartifact.bootstrapSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Generated once, then reused from the live Secret so upgrades never change them. */}}
{{- $password := (get $existing "admin-password") | b64dec | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openartifact.labels" . | nindent 4 }}
  {{- if .Values.secrets.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  admin-password: {{ $password | b64enc | quote }}
  {{- if .Values.bootstrap.adminToken.enabled }}
  admin-token: {{ (get $existing "admin-token") | b64dec | default (printf "oa_pat_%s" (randAlphaNum 64)) | b64enc | quote }}
  {{- end }}
{{- end }}
