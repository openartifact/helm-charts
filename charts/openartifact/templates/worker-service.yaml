{{- /*
Scrape target of the worker Deployment. It carries the chart labels, so the ServiceMonitor
(which selects by those) scrapes web and worker alike; no Ingress or HTTPRoute points at it.
*/ -}}
{{- if and .Values.worker.enabled .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openartifact.fullname" . }}-worker
  labels:
    {{- include "openartifact.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openartifact.workerSelectorLabels" . | nindent 4 }}
{{- end }}
