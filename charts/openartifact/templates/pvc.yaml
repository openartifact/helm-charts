{{- $claims := list }}
{{- if and (include "openartifact.filesystemStorage" .) .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- $claims = append $claims (dict "suffix" "data" "p" .Values.persistence) }}
{{- end }}
{{- if and .Values.backups.persistence.enabled (not .Values.backups.persistence.existingClaim) }}
{{- $claims = append $claims (dict "suffix" "backups" "p" .Values.backups.persistence) }}
{{- end }}
{{- if and .Values.dockerUploads.dir .Values.dockerUploads.persistence.enabled (not .Values.dockerUploads.persistence.existingClaim) }}
{{- $claims = append $claims (dict "suffix" "docker-uploads" "p" .Values.dockerUploads.persistence) }}
{{- end }}
{{- if and .Values.scanners.cache.persistence.enabled (not .Values.scanners.cache.persistence.existingClaim) }}
{{- $claims = append $claims (dict "suffix" "scanner-cache" "p" .Values.scanners.cache.persistence) }}
{{- end }}
{{- if and .Values.storage.spoolPath .Values.storage.spool.persistence.enabled (not .Values.storage.spool.persistence.existingClaim) }}
{{- $claims = append $claims (dict "suffix" "spool" "p" .Values.storage.spool.persistence) }}
{{- end }}
{{- if and .Values.storage.stagingPath .Values.storage.staging.persistence.enabled (not .Values.storage.staging.persistence.existingClaim) }}
{{- $claims = append $claims (dict "suffix" "staging" "p" .Values.storage.staging.persistence) }}
{{- end }}
{{- range $claims }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openartifact.fullname" $ }}-{{ .suffix }}
  labels:
    {{- include "openartifact.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .p.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .p.accessModes | nindent 4 }}
  {{- with .p.storageClass }}
  storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .p.size }}
{{- end }}
