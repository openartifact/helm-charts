apiVersion: v1
kind: Pod
metadata:
  name: {{ include "openartifact.fullname" . }}-test
  labels:
    {{- include "openartifact.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "openartifact.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - wget
        - -q
        - -O
        - "-"
        - http://{{ include "openartifact.fullname" . }}:{{ .Values.service.port }}/ready
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
