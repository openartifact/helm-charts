{{- include "openartifact.validate" . }}
{{- $fullname := include "openartifact.fullname" . }}
{{- $fs := include "openartifact.filesystemStorage" . }}
{{- $storageCreds := include "openartifact.storageCredentials" . | fromYaml }}
{{- $collector := .Values.telemetry.collector }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "openartifact.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- if .Values.updateStrategy }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- else if include "openartifact.singleWriterVolume" . }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "openartifact.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secrets: {{ list .Values.secrets .Values.storage.credentials .Values.database.external.password .Values.metrics.authToken | toYaml | sha256sum }}
        {{- if $collector.enabled }}
        checksum/collector-config: {{ include "openartifact.collectorConfig" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openartifact.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openartifact.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or $collector.enabled .Values.extraInitContainers }}
      initContainers:
        {{- if $collector.enabled }}
        # Native sidecar: starts before the app and stops after it, so the app's final
        # telemetry flush still reaches it.
        - name: otel-collector
          image: {{ include "openartifact.collectorImage" . }}
          imagePullPolicy: {{ $collector.image.pullPolicy }}
          restartPolicy: Always
          args:
            - --config=/etc/otelcol/config.yaml
            {{- if $collector.pprof.enabled }}
            - --feature-gates=+service.profilesSupport
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or $collector.exporter.headersExistingSecret $collector.pprof.enabled }}
          env:
            {{- with $collector.exporter.headersExistingSecret }}
            - name: OTLP_EXPORTER_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $collector.exporter.headersSecretKey }}
            {{- end }}
            {{- if $collector.pprof.enabled }}
            - name: PPROF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $collector.pprof.tokenExistingSecret }}
                  key: {{ $collector.pprof.tokenSecretKey }}
            {{- end }}
          {{- end }}
          ports:
            - name: otel-health
              containerPort: 13133
              protocol: TCP
          # Liveness only: the Collector must never gate the app's readiness.
          livenessProbe:
            httpGet:
              path: /
              port: otel-health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $collector.resources | nindent 12 }}
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol
              readOnly: true
            - name: otel-collector-queue
              mountPath: /var/lib/otelcol/file_storage
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: openartifact
          image: {{ include "openartifact.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "openartifact.secretName" . }}
            {{- if or .Values.storage.credentials.existingSecret $storageCreds }}
            - secretRef:
                name: {{ include "openartifact.storageSecretName" . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SHUTDOWN_TIMEOUT
              value: {{ .Values.config.shutdownTimeout | quote }}
            - name: DB_CONNECT_TIMEOUT
              value: {{ ternary .Values.database.connectTimeout "0s" .Values.database.waitForDatabase | quote }}
            {{- with .Values.baseUrl }}
            - name: BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: LOG_OUTPUT
              value: stdout
            - name: ALLOW_ANONYMOUS_READ
              value: {{ .Values.config.allowAnonymousRead | quote }}
            - name: LEGACY_API_KEY_ENABLED
              value: {{ .Values.config.legacyApiKeyEnabled | quote }}
            - name: SESSION_DURATION_HOURS
              value: {{ .Values.config.sessionDurationHours | quote }}
            {{- with .Values.config.corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.config.trustedProxies }}
            - name: OPENARTIFACT_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.config.ipAllowlist }}
            - name: OPENARTIFACT_IP_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            - name: OPENARTIFACT_RATE_LIMIT_RPS
              value: {{ .Values.config.rateLimitRps | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.config.migrateOnStart | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_ALLOW_ANONYMOUS
              value: "false"
            {{- end }}
            # Database
            - name: DB_DRIVER
              value: postgres
            - name: DB_HOST
              value: {{ include "openartifact.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "openartifact.dbPort" . | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslMode | quote }}
            - name: DB_MAX_OPEN_CONNS
              value: {{ .Values.database.maxOpenConns | quote }}
            - name: DB_MAX_IDLE_CONNS
              value: {{ .Values.database.maxIdleConns | quote }}
            - name: DB_CONN_MAX_LIFETIME_MINUTES
              value: {{ .Values.database.connMaxLifetimeMinutes | quote }}
            {{- if .Values.cnpg.enabled }}
            - name: DB_NAME
              value: {{ .Values.cnpg.database | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openartifact.cnpgClusterName" . }}-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openartifact.cnpgClusterName" . }}-app
                  key: password
            {{- else }}
            - name: DB_NAME
              value: {{ .Values.database.external.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.external.user | quote }}
            {{- with .Values.database.external.existingSecret }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.database.external.existingSecretPasswordKey }}
            {{- end }}
            {{- end }}
            # Storage
            - name: STORAGE_BACKEND
              value: {{ .Values.storage.type | quote }}
            {{- if $fs }}
            - name: STORAGE_PATH
              value: {{ .Values.storage.path | quote }}
            {{- end }}
            {{- with .Values.storage.bucket }}
            - name: STORAGE_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.region }}
            - name: STORAGE_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.endpoint }}
            - name: STORAGE_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.storage.forcePathStyle }}
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: "true"
            {{- end }}
            {{- with .Values.storage.presignTtl }}
            - name: STORAGE_S3_PRESIGN_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.gcs.bucket }}
            - name: OPENARTIFACT_GCS_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.azure.accountName }}
            - name: OPENARTIFACT_AZURE_ACCOUNT_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.storage.azure.containerName }}
            - name: OPENARTIFACT_AZURE_CONTAINER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.storage.oci.insecure }}
            - name: STORAGE_OCI_INSECURE
              value: "true"
            {{- end }}
            - name: OPENARTIFACT_BACKUP_DIR
              value: {{ .Values.backups.path | quote }}
            {{- with .Values.backups.leaseTtl }}
            - name: OPENARTIFACT_BACKUP_LEASE_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.projectsSelfCreate }}
            - name: OPENARTIFACT_PROJECTS_SELF_CREATE
              value: "true"
            {{- end }}
            {{- with .Values.dockerUploads.dir }}
            - name: OPENARTIFACT_DOCKER_UPLOAD_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dockerUploads.ttl }}
            - name: OPENARTIFACT_DOCKER_UPLOAD_TTL
              value: {{ . | quote }}
            {{- end }}
            # Blob deletion and storage tiering (only set values are passed; server defaults otherwise)
            {{- with .Values.blobDeletion.grace }}
            - name: OPENARTIFACT_BLOB_DELETION_GRACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.blobDeletion.sweepInterval }}
            - name: OPENARTIFACT_BLOB_DELETION_SWEEP_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- if kindIs "float64" .Values.blobDeletion.sweepBatch }}
            - name: OPENARTIFACT_BLOB_DELETION_SWEEP_BATCH
              value: {{ .Values.blobDeletion.sweepBatch | int64 | quote }}
            {{- end }}
            {{- if kindIs "bool" .Values.tiering.enabled }}
            - name: OPENARTIFACT_TIERING_ENABLED
              value: {{ .Values.tiering.enabled | quote }}
            {{- end }}
            {{- with .Values.tiering.interval }}
            - name: OPENARTIFACT_TIERING_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- if kindIs "float64" .Values.tiering.batch }}
            - name: OPENARTIFACT_TIERING_BATCH
              value: {{ .Values.tiering.batch | int64 | quote }}
            {{- end }}
            {{- if kindIs "float64" .Values.tiering.concurrency }}
            - name: OPENARTIFACT_TIERING_CONCURRENCY
              value: {{ .Values.tiering.concurrency | int64 | quote }}
            {{- end }}
            {{- if kindIs "float64" .Values.tiering.maxBytesPerSecond }}
            - name: OPENARTIFACT_TIERING_MAX_BYTES_PER_SECOND
              value: {{ .Values.tiering.maxBytesPerSecond | int64 | quote }}
            {{- end }}
            {{- if kindIs "bool" .Values.tiering.verifyReadback }}
            - name: OPENARTIFACT_TIERING_VERIFY_READBACK
              value: {{ .Values.tiering.verifyReadback | quote }}
            {{- end }}
            {{- with .Values.tiering.accessFlushInterval }}
            - name: OPENARTIFACT_TIERING_ACCESS_FLUSH_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.tiering.refreshInterval }}
            - name: OPENARTIFACT_TIERING_REFRESH_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            # Vulnerability scanners
            - name: OPENARTIFACT_SCANNER_CACHE_DIR
              value: {{ .Values.scanners.cache.path | quote }}
            {{- if .Values.scanners.offline }}
            - name: OPENARTIFACT_SCANNER_OFFLINE
              value: "true"
            {{- end }}
            {{- with .Values.scanners.updateInterval }}
            - name: OPENARTIFACT_SCANNER_UPDATE_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.scanners.downloadBaseUrl }}
            - name: OPENARTIFACT_SCANNER_DOWNLOAD_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.scanners.trivy.install "auto" }}
            - name: OPENARTIFACT_TRIVY_INSTALL
              value: auto
            {{- end }}
            {{- with .Values.scanners.trivy.path }}
            - name: OPENARTIFACT_TRIVY_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.scanners.trivy.dbRepository }}
            - name: OPENARTIFACT_TRIVY_DB_REPOSITORY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.scanners.trivy.javaDbRepository }}
            - name: OPENARTIFACT_TRIVY_JAVA_DB_REPOSITORY
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.scanners.grype.install "auto" }}
            - name: OPENARTIFACT_GRYPE_INSTALL
              value: auto
            {{- end }}
            {{- with .Values.scanners.grype.path }}
            - name: OPENARTIFACT_GRYPE_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.scanners.grype.dbUrl }}
            - name: OPENARTIFACT_GRYPE_DB_URL
              value: {{ . | quote }}
            {{- end }}
            # OpenTelemetry
            {{- with .Values.telemetry.otlp }}
            {{- if .enabled }}
            - name: OPENARTIFACT_OTLP_ENABLED
              value: "true"
            {{- if $collector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ ternary "http://localhost:4318" "localhost:4317" (hasPrefix "http" (.protocol | default "")) | quote }}
            {{- else }}
            {{- with .endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .protocol }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .insecure $collector.enabled }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            {{- end }}
            {{- with .serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if kindIs "float64" .sampleRatio }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .sampleRatio | quote }}
            {{- end }}
            {{- if .metrics }}
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            {{- end }}
            {{- if not $collector.enabled }}
            {{- with .headersExistingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.telemetry.otlp.headersSecretKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.pprof.enabled }}
            - name: OPENARTIFACT_PPROF_ENABLED
              value: "true"
            {{- end }}
            # GPG
            - name: GPG_ENABLED
              value: {{ .Values.gpg.enabled | quote }}
            {{- if .Values.gpg.enabled }}
            - name: GPG_KEY_PATH
              value: /etc/openartifact/gpg/private.key
            - name: GPG_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gpg.existingSecret }}
                  key: passphrase
                  optional: true
            {{- end }}
            {{- if include "openartifact.bootstrapEnabled" . }}
            # First admin (applied only to an empty database)
            - name: OPENARTIFACT_BOOTSTRAP_ADMIN_PASSWORD_FILE
              value: /etc/openartifact/bootstrap/admin-password
            {{- if .Values.bootstrap.adminToken.enabled }}
            - name: OPENARTIFACT_BOOTSTRAP_ADMIN_TOKEN_FILE
              value: /etc/openartifact/bootstrap/admin-token
            {{- with .Values.bootstrap.adminToken.ttl }}
            - name: OPENARTIFACT_BOOTSTRAP_ADMIN_TOKEN_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.bootstrap.forcePasswordChange }}
            - name: OPENARTIFACT_BOOTSTRAP_FORCE_PASSWORD_CHANGE
              value: "true"
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.dockerUploads.dir }}
            - name: docker-uploads
              mountPath: {{ .Values.dockerUploads.dir }}
            {{- end }}
            - name: scanner-cache
              mountPath: {{ .Values.scanners.cache.path }}
            {{- if $fs }}
            - name: data
              mountPath: {{ .Values.storage.path }}
            {{- end }}
            - name: backups
              mountPath: {{ .Values.backups.path }}
            {{- if .Values.gpg.enabled }}
            - name: gpg
              mountPath: /etc/openartifact/gpg
              readOnly: true
            {{- end }}
            {{- if include "openartifact.bootstrapEnabled" . }}
            - name: bootstrap
              mountPath: /etc/openartifact/bootstrap
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- with .Values.tmp.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
            {{- with .Values.tmp.medium }}
            medium: {{ . }}
            {{- end }}
            {{- if and (not .Values.tmp.sizeLimit) (not .Values.tmp.medium) }}
            {}
            {{- end }}
        {{- if .Values.dockerUploads.dir }}
        - name: docker-uploads
          {{- if .Values.dockerUploads.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.dockerUploads.persistence.existingClaim | default (printf "%s-docker-uploads" $fullname) }}
          {{- else }}
          emptyDir:
            {{- with .Values.dockerUploads.sizeLimit }}
            sizeLimit: {{ . }}
            {{- else }}
            {}
            {{- end }}
          {{- end }}
        {{- end }}
        - name: scanner-cache
          {{- if .Values.scanners.cache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.scanners.cache.persistence.existingClaim | default (printf "%s-scanner-cache" $fullname) }}
          {{- else }}
          emptyDir:
            {{- with .Values.scanners.cache.sizeLimit }}
            sizeLimit: {{ . }}
            {{- else }}
            {}
            {{- end }}
          {{- end }}
        {{- if $fs }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" $fullname) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: backups
          {{- if .Values.backups.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.backups.persistence.existingClaim | default (printf "%s-backups" $fullname) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.gpg.enabled }}
        - name: gpg
          secret:
            secretName: {{ .Values.gpg.existingSecret }}
            defaultMode: 0440
            items:
              - key: private.key
                path: private.key
        {{- end }}
        {{- if include "openartifact.bootstrapEnabled" . }}
        - name: bootstrap
          secret:
            secretName: {{ include "openartifact.bootstrapSecretName" . }}
            defaultMode: 0440
            items:
              - key: admin-password
                path: admin-password
              {{- if .Values.bootstrap.adminToken.enabled }}
              - key: admin-token
                path: admin-token
              {{- end }}
        {{- end }}
        {{- if $collector.enabled }}
        - name: otel-collector-config
          configMap:
            name: {{ $fullname }}-otel-collector
        - name: otel-collector-queue
          emptyDir:
            {{- with $collector.queueSizeLimit }}
            sizeLimit: {{ . }}
            {{- else }}
            {}
            {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "openartifact.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
