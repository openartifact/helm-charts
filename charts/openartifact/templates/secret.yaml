{{- if not .Values.secrets.existingSecret }}
{{- $name := include "openartifact.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $data := dict }}
{{- /* Generated keys are reused from the live Secret so upgrades never rotate them. */}}
{{- $_ := set $data "AUTH_HMAC_KEY" (.Values.secrets.hmacKey | default ((get $existing "AUTH_HMAC_KEY") | b64dec) | default (randAlphaNum 64)) }}
{{- $_ := set $data "OPENARTIFACT_SECRET_KEY" (.Values.secrets.encryptionKey | default ((get $existing "OPENARTIFACT_SECRET_KEY") | b64dec) | default (randAlphaNum 48)) }}
{{- if .Values.metrics.enabled }}
{{- $_ := set $data "METRICS_AUTH_TOKEN" (.Values.metrics.authToken | default ((get $existing "METRICS_AUTH_TOKEN") | b64dec) | default (randAlphaNum 48)) }}
{{- end }}
{{- with .Values.secrets.apiKey }}
{{- $_ := set $data "API_KEY" . }}
{{- end }}
{{- if and (not .Values.cnpg.enabled) (not .Values.database.external.existingSecret) .Values.database.external.password }}
{{- $_ := set $data "DB_PASSWORD" .Values.database.external.password }}
{{- end }}
{{- range $k, $v := .Values.secrets.extra }}
{{- $_ := set $data $k (toString $v) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openartifact.labels" . | nindent 4 }}
  {{- if .Values.secrets.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
{{- $storage := include "openartifact.storageCredentials" . | fromYaml }}
{{- if and (not .Values.storage.credentials.existingSecret) $storage }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openartifact.storageSecretName" . }}
  labels:
    {{- include "openartifact.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $storage }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
