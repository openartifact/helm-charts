apiVersion: v1
entries:
  openartifact:
  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: Default image OpenArtifact 0.19.0. Migrations 010 to 013 run on start (no action needed). Deb and RPM repositories publish gzip indexes only (no .xz), Docker pushes in progress during the upgrade must be retried, the repository list counts lag up to 15 s, and the image ships one binary (oa is a link to the server binary). On filesystem storage uploads are spooled under the storage path (spool directory). Chart templates unchanged.
        - kind: security
          description: Known issue - the optional Collector sidecar image (otel/opentelemetry-collector-contrib 0.163.2, off by default) carries go-jose/v4 4.1.5 (CVE-2026-116587, HIGH, DoS when parsing JWKs with RSA keys; fixed in 4.1.6). No collector release ships the fix yet; it is ignored in CI until 2026-11-27 and the sidecar does not parse untrusted JWKs in the chart's configuration.
      artifacthub.io/images: |
        - name: openartifact
          image: ghcr.io/openartifact/openartifact:0.19.0
          platforms:
            - linux/amd64
            - linux/arm64
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.163.2
          platforms:
            - linux/amd64
            - linux/arm64
      artifacthub.io/license: AGPL-3.0-or-later
      artifacthub.io/signKey: |
        fingerprint: 2CB218184F573BAAFC532E84D4DE9B5D6FDD2ACD
