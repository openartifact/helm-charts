  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: Default image OpenArtifact 0.15.0. BREAKING, no in-place upgrade from 0.14 - the database schema was squashed into one baseline and a 0.15 server refuses a 0.14 database (ErrLegacySchema). Install into an empty database (or move the data with `oa import openartifact`), see the chart README. Needs a fresh database, 0.14 backups and recovery sidecars are refused.
        - kind: added
          description: worker.enabled splits the roles into two Deployments (OPENARTIFACT_ROLE web and worker, with a scrape Service for the workers); the default stays one Deployment with role all (config.role).
        - kind: added
          description: storage.spoolPath and storage.stagingPath (STORAGE_SPOOL_PATH, STORAGE_STAGING_PATH) with spool and staging volumes (emptyDir or PVC); storage.type=oci now requires a persistent stagingPath.
        - kind: added
          description: config.idleTimeout, config.maxHeaderBytes, config.argon2MaxConcurrent, gpg.bundleSigners and federation.maxClockSkew pass the new 0.15 settings.
        - kind: changed
          description: With ingress.enabled or httpRoute.enabled and an empty config.trustedProxies the chart now sets OPENARTIFACT_TRUSTED_PROXIES to ingress.trustedProxies (the private ranges), so client IPs, forwarded URLs and the CSRF/Secure-cookie decisions work behind the controller. Set ingress.trustedProxies to your controller's CIDR, or [] to trust no proxy.
        - kind: changed
          description: OPENARTIFACT_SECRET_KEY and AUTH_HMAC_KEY are required by 0.15. The chart-managed Secret generates both once (kept through lookup); with secrets.existingSecret the render fails when the live Secret lacks either key. baseUrl is optional but still needed for SSO.
        - kind: security
          description: Known issue - the optional Collector sidecar image (otel/opentelemetry-collector-contrib 0.163.2, off by default) carries go-jose/v4 4.1.5 (CVE-2026-116587, HIGH, DoS when parsing JWKs with RSA keys; fixed in 4.1.6). No collector release ships the fix yet; it is ignored in CI until 2026-11-27 and the sidecar does not parse untrusted JWKs in the chart's configuration.
      artifacthub.io/images: |
        - name: openartifact
          image: ghcr.io/openartifact/openartifact:0.15.0
          platforms:
